[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-owners"
version = "0.1.0"
description = "Offline, install-aware ownership preflight for a set of Python wheels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "wheel-owners contributors"}]
dependencies = ["installer==0.7.0", "packaging>=24.2,<27"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1.2,<2"]

[project.scripts]
wheel-owners = "wheel_owners.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
